name: Deploy backend-cf

on:
  push:
    branches: [main, master, develop, dev]
    paths:
      - 'backend-cf/**'
      - '.github/workflows/backend-cf.yml'
  pull_request:
    paths:
      - 'backend-cf/**'
      - '.github/workflows/backend-cf.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-cf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-cf/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test

  migrate:
    name: Apply D1 migrations
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-cf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-cf/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Resolve target
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=${{ github.event.inputs.target }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/dev" ] || [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "env=staging" >> "$GITHUB_OUTPUT"
          else
            echo "env=production" >> "$GITHUB_OUTPUT"
          fi
      - name: Migrate staging
        if: steps.target.outputs.env == 'staging'
        run: npx wrangler d1 migrations apply lardermind-staging --remote --env staging
      - name: Migrate production
        if: steps.target.outputs.env == 'production'
        run: npx wrangler d1 migrations apply lardermind --remote

  deploy:
    name: Deploy Worker
    needs: migrate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-cf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-cf/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Resolve target
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=${{ github.event.inputs.target }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/dev" ] || [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "env=staging" >> "$GITHUB_OUTPUT"
          else
            echo "env=production" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy staging
        if: steps.target.outputs.env == 'staging'
        run: npx wrangler deploy --env staging
      - name: Deploy production
        if: steps.target.outputs.env == 'production'
        run: npx wrangler deploy
