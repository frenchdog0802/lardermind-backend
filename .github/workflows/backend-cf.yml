name: Deploy backend-cf

on:
  push:
    branches: [main, master]
    paths:
      - 'backend-cf/**'
      - '.github/workflows/backend-cf.yml'

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-cf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-cf/package-lock.json
      - run: npm ci --legacy-peer-deps

  migrate:
    name: Apply D1 migrations
    needs: install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-cf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-cf/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx wrangler d1 migrations apply lardermind --remote

  deploy:
    name: Deploy Worker
    needs: migrate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-cf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-cf/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx wrangler deploy
