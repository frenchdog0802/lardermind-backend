name = "lardermind-api"
main = "src/index.ts"
compatibility_date = "2026-09-14"
compatibility_flags = ["nodejs_compat"]

# After `npm run db:create`, paste database_id below.
[[d1_databases]]
binding = "DB"
database_name = "lardermind"
database_id = "9f238601-49f0-47df-a83d-212ae497e65b"
migrations_dir = "migrations"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "R2"
bucket_name = "lardermind-media"

[vars]
CORS_ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://lardermind.com,https://lardermind-web.pages.dev"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
JWT_EXPIRES_IN_SECONDS = "2592000"

# Secrets (wrangler secret put):
#   JWT_SECRET — min 32 chars, same as Nest if you want shared tokens during cutover tests
